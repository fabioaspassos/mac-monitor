; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
; Credenciais do Wi-Fi e senha do OTA ficam fora do git (copie de secrets.ini.example)
extra_configs = secrets.ini
; "pio run" sem -e usa o USB
default_envs = esp32dev

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
; Velocidade do Serial Monitor (tem que bater com Serial.begin no código)
monitor_speed = 115200
; Decodifica travamentos e mostra horário em cada linha
monitor_filters = esp32_exception_decoder, time
; Velocidade de gravação. Se der erro na gravação, troque para 460800 ou 115200
upload_speed = 460800
; LVGL + fontes + Wi-Fi não cabem com folga na partição padrão de 1,2 MB;
; min_spiffs tem 2 slots de app de 1,9 MB, necessários para o OTA
board_build.partitions = min_spiffs.csv

lib_deps =
    bodmer/TFT_eSPI@^2.5.43
    bblanchon/ArduinoJson@^7
    lvgl/lvgl@9.2.2
    https://github.com/PaulStoffregen/XPT2046_Touchscreen.git
    h2zero/NimBLE-Arduino@^2
build_flags =
    ; LVGL: usa o include/lv_conf.h do projeto
    -D LV_CONF_INCLUDE_SIMPLE
    -I include
    ; Tela (TFT_eSPI, usada pelo driver do LVGL)
    -D USER_SETUP_LOADED=1
    -D ILI9341_2_DRIVER=1      ; variante com 2 USB: ST7789_DRIVER=1
    -D TFT_WIDTH=240
    -D TFT_HEIGHT=320
    -D TFT_INVERSION_ON=1      ; equivale ao tft.invertDisplay(true) das fases anteriores
    -D USE_HSPI_PORT=1
    -D TFT_MISO=12
    -D TFT_MOSI=13
    -D TFT_SCLK=14
    -D TFT_CS=15
    -D TFT_DC=2
    -D TFT_RST=-1
    -D TFT_BL=21
    -D TFT_BACKLIGHT_ON=HIGH
    -D SPI_FREQUENCY=40000000
    -D SPI_READ_FREQUENCY=20000000
    ; Toque XPT2046 (barramento VSPI separado no CYD)
    -D XPT_CS=33
    -D XPT_IRQ=36
    -D XPT_MOSI=32
    -D XPT_MISO=39
    -D XPT_SCLK=25
    ; Bluetooth LE (NimBLE): só periférico com 1 conexão, para economizar RAM/flash
    -D CONFIG_BT_NIMBLE_MAX_CONNECTIONS=1
    -D CONFIG_BT_NIMBLE_ROLE_CENTRAL_DISABLED
    -D CONFIG_BT_NIMBLE_ROLE_OBSERVER_DISABLED
    ; Wi-Fi + OTA (valores vêm do secrets.ini)
    '-D WIFI_SSID="${secrets.wifi_ssid}"'
    '-D WIFI_PASS="${secrets.wifi_pass}"'
    '-D OTA_PASSWORD="${secrets.ota_password}"'

; Gravação pela rede: pio run -e esp32dev_ota -t upload
; (a primeira gravação com a tabela min_spiffs tem que ser por USB)
[env:esp32dev_ota]
extends = env:esp32dev
upload_protocol = espota
upload_port = macmonitor.local
upload_flags =
    --auth=${secrets.ota_password}
